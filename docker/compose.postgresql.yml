services:
  postgres_messages:
    image: postgres:16-alpine
    container_name: postgres_messages
    env_file: ../.env
    environment:
      POSTGRES_DB: ${PG_DATABASE:-whatsapp_messages}
      POSTGRES_USER: ${PG_USER:-app_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-app_admin} -d ${PG_DATABASE:-whatsapp_messages}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_messages_data:/var/lib/postgresql/data
    networks: [appnet]
    ports:
      - "5433:5432"
